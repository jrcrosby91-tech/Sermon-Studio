workflows:
  macos-test:
    name: Sermon Studio macOS test build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Prepare public Sparkle artifact download
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.swiftpm"
          git config --global credential.interactive never
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --output /tmp/Sparkle-for-Swift-Package-Manager.zip https://github.com/sparkle-project/Sparkle/releases/download/2.7.1/Sparkle-for-Swift-Package-Manager.zip
          unzip -t /tmp/Sparkle-for-Swift-Package-Manager.zip | tail -n 2
          mkdir -p macos/.codemagic-sparkle
          unzip -q /tmp/Sparkle-for-Swift-Package-Manager.zip -d macos/.codemagic-sparkle
          echo "Downloaded Sparkle framework:"
          find macos/.codemagic-sparkle -name '*.xcframework' -maxdepth 4 -print
          python3 - <<'PY'
          from pathlib import Path
          base = Path("macos/.codemagic-sparkle")
          frameworks = list(base.rglob("Sparkle.xcframework"))
          if len(frameworks) != 1:
              raise SystemExit(f"Expected one Sparkle.xcframework, found {len(frameworks)}")
          framework = frameworks[0].relative_to(base).as_posix()
          (base / "Package.swift").write_text(
              '// swift-tools-version: 5.9\nimport PackageDescription\n'
              'let package = Package(name: "Sparkle", platforms: [.macOS(.v10_13)], '
              'products: [.library(name: "Sparkle", targets: ["Sparkle"])], '
              f'targets: [.binaryTarget(name: "Sparkle", path: "{framework}")])\n'
          )
          manifest = Path("macos/Package.swift")
          source = manifest.read_text()
          old = '.package(url: "https://github.com/sparkle-project/Sparkle.git", exact: "2.7.1")'
          if old not in source:
              raise SystemExit("Sparkle dependency declaration changed")
          manifest.write_text(source.replace(old, '.package(name: "Sparkle", path: ".codemagic-sparkle")'))
          print("SwiftPM configured to use locally downloaded Sparkle.")
          PY
      - name: Build macOS app and installers
        script: |
          set -euo pipefail
          uname -m
          swift --version
          set +e
          CI=1 SERMON_VERSION=3.0.3 SERMON_BUILD_NUMBER=4 bash macos/build-local.sh
          result=$?
          if [ "$result" -ne 0 ]; then
            echo '========== BUILD ERRORS =========='
            if [ -f macos/dist/build.log ]; then
              grep -n -E -C 4 'error:|fatal error:|BUILD FAILED|Build failed|failed to' macos/dist/build.log | tail -n 180 || true
              echo '========== LAST 100 LOG LINES =========='
              tail -n 100 macos/dist/build.log
            fi
          fi
          exit "$result"
    artifacts:
      - macos/dist/*.dmg
      - macos/dist/*.zip
      - macos/dist/build.log
