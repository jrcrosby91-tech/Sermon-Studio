workflows:
  macos-test:
    name: Sermon Studio macOS test build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Build macOS app and installers
        script: |
          set -euo pipefail
          uname -m
          swift --version
          CI=1 SERMON_VERSION=3.0.3 SERMON_BUILD_NUMBER=4 bash macos/build-local.sh
    artifacts:
      - macos/dist/*.dmg
      - macos/dist/*.zip
      - macos/dist/build.log
