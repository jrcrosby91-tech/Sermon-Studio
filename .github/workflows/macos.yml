name: Build native macOS preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          uname -m
          sw_vers
          swift --version
      - name: Run SermonCore tests
        working-directory: macos
        run: swift test --parallel 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Build, package and sign (ad hoc) the app
        run: CI=1 bash macos/build-local.sh
      - name: Verify bundle and launch the app
        run: |
          set -euo pipefail
          rm -rf /tmp/verify && mkdir /tmp/verify
          ditto -x -k macos/dist/Sermon-Studio-macOS-arm64.zip /tmp/verify
          APP="/tmp/verify/Sermon Studio.app"
          test -x "$APP/Contents/MacOS/SermonStudio"
          test -f "$APP/Contents/Resources/SermonStudio.icns"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleIconFile|SUFeedURL'
          lipo -archs "$APP/Contents/MacOS/SermonStudio"
          codesign --verify --strict "$APP"
          # Startup smoke test: the app must still be running after 20 seconds.
          "$APP/Contents/MacOS/SermonStudio" > /tmp/launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then echo "App is running (pid $PID)"; kill "$PID"; else echo "App exited during startup"; cat /tmp/launch.log; ls ~/Library/Logs/DiagnosticReports 2>/dev/null | tail; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sermon-Studio-macOS-arm64
          path: |
            macos/dist/*.dmg
            macos/dist/build.log
            macos/test.log
