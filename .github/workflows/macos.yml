name: Build native macOS preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Use the same packaging script as releases. Packaging only the bare executable
      # left out Sparkle.framework (the app could not launch), the icon and resource bundles.
      - name: Compile and package Apple Silicon application
        env:
          CI: '1'
        run: bash macos/build-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sermon-Studio-macOS-arm64
          path: |
            macos/dist/Sermon-Studio-macOS-arm64.dmg
            macos/dist/Sermon-Studio-macOS-arm64.zip
            macos/dist/build.log
          if-no-files-found: warn
