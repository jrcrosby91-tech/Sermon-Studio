name: Sermon Studio Windows test build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows-build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-build.yml']
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pin installed .NET 10 SDK
        run: |
          $sdk = dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } | Where-Object { $_ -match '^10\.0\.\d+$' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (!$sdk) { throw "No .NET 10 SDK installed" }
          @{ sdk = @{ version = $sdk; rollForward = 'disable' } } | ConvertTo-Json | Set-Content global.json
          dotnet --info
      - name: Run archive regression tests
        run: |
          dotnet run --project windows/ArchiveTests/ArchiveTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed (exit code $LASTEXITCODE); publishing is blocked." }
      - name: Publish runnable Windows x64 application
        run: |
          dotnet publish windows/SermonStudio/SermonStudio.csproj -warnaserror:CS8600,CS8601,CS8602,CS8603,CS8604,CS8618,CS8625 --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:PublishSingleFile=false -p:GenerateAppxPackageOnBuild=false --output "$env:GITHUB_WORKSPACE/windows-publish"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          if (!(Test-Path "windows-publish/SermonStudio.exe")) { throw "Windows executable missing from published output." }
          # WinUI cannot load XAML or theme resources without the app's resource index.
          if (!(Test-Path "windows-publish/SermonStudio.pri") -and !(Test-Path "windows-publish/resources.pri")) { throw "SermonStudio.pri missing from published output; the app would crash at startup." }
      - name: Bundle local transcription engines
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin after the first verified run if the upstream release has no published digest.
          WHISPER_SHA256: ''
        run: |
          $engine = "$env:GITHUB_WORKSPACE/windows-publish/engines"
          New-Item -ItemType Directory -Force "$engine/whisper", "$engine/ffmpeg" | Out-Null
          # Download the pinned whisper.cpp release asset directly (avoids the unauthenticated API rate limit)
          # and verify it against GitHub's published asset digest or the pinned hash above.
          $whisperRepo = "ggml-org/whisper.cpp"; $whisperTag = "v1.7.6"; $whisperAsset = "whisper-bin-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/$whisperRepo/releases/download/$whisperTag/$whisperAsset" -OutFile "$env:RUNNER_TEMP/whisper.zip" -MaximumRetryCount 3 -RetryIntervalSec 5
          $whisperHash = (Get-FileHash "$env:RUNNER_TEMP/whisper.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $digest = ""
          try { $release = gh api "repos/$whisperRepo/releases/tags/$whisperTag" | ConvertFrom-Json; $digest = [string](($release.assets | Where-Object { $_.name -eq $whisperAsset }).digest) } catch { $digest = "" }
          Write-Host "$whisperAsset sha256=$whisperHash published=$digest"
          if ($digest) { if ($digest.Trim() -ne "sha256:$whisperHash") { throw "whisper.cpp download does not match the published SHA-256 digest." } }
          elseif ($env:WHISPER_SHA256) { if ($env:WHISPER_SHA256 -ne $whisperHash) { throw "whisper.cpp download does not match the pinned SHA-256." } }
          else { Write-Host "::warning::No published or pinned SHA-256 for $whisperAsset; recorded $whisperHash" }
          Expand-Archive "$env:RUNNER_TEMP/whisper.zip" "$engine/whisper" -Force
          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest $ffmpegUrl -OutFile "$env:RUNNER_TEMP/ffmpeg.zip" -MaximumRetryCount 3 -RetryIntervalSec 5
          $ffmpegHash = (Get-FileHash "$env:RUNNER_TEMP/ffmpeg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $published = ""
          try { $published = ((Invoke-WebRequest "$ffmpegUrl.sha256" -MaximumRetryCount 3 -RetryIntervalSec 5).Content | Out-String).Trim().Split(" ")[0].ToLowerInvariant() } catch { $published = "" }
          Write-Host "ffmpeg-release-essentials.zip sha256=$ffmpegHash published=$published"
          if ($published) { if ($published -ne $ffmpegHash) { throw "FFmpeg download does not match the published SHA-256." } }
          else { Write-Host "::warning::FFmpeg checksum file unavailable; recorded $ffmpegHash" }
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$engine/ffmpeg" -Force
          foreach ($name in @("whisper-cli.exe","ffmpeg.exe")) {
            if (!(Get-ChildItem $engine -Recurse -Filter $name)) { throw "Missing engine: $name" }
          }
          Invoke-WebRequest "https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.6/LICENSE" -OutFile "$engine/whisper/LICENSE.txt"
          "FFmpeg distribution: https://www.gyan.dev/ffmpeg/builds/ ; sha256 $ffmpegHash ; upstream source: https://ffmpeg.org/download.html ; retain included license notices." | Set-Content "$engine/ffmpeg/SOURCE.txt"
          "whisper.cpp $whisperTag $whisperAsset sha256 $whisperHash" | Set-Content "$engine/whisper/SOURCE.txt"
          "windows-test-${{ github.run_number }}-${{ github.run_attempt }}" | Set-Content "windows-publish/build-tag.txt"
      - name: Create portable ZIP
        run: Compress-Archive -Path "windows-publish/*" -DestinationPath "Sermon-Studio-Windows-x64-portable.zip" -Force
      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: Sermon-Studio-Windows-x64-portable
          path: Sermon-Studio-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Publish Windows test prerelease
    needs: windows-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sermon-Studio-Windows-x64-portable
          path: release
      - name: Publish versioned Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: windows-test-${{ github.run_number }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" release/Sermon-Studio-Windows-x64-portable.zip \
            --target "$COMMIT" \
            --title "Sermon Studio Windows Test Build ${TAG#windows-test-}" \
            --prerelease --latest=false \
            --notes "Experimental Windows x64 portable build. Extract the entire ZIP and launch SermonStudio.exe. Unsigned; runtime testing is still required. Whisper and FFmpeg are bundled; download a model inside the application. Ollama is optional. This release does not replace the macOS stable release."
