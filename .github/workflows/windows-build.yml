name: Sermon Studio Windows test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows-test:
    name: Build native WinUI 3 app (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK information
        run: dotnet --info

      - name: Restore Windows dependencies
        run: dotnet restore windows/SermonStudio/SermonStudio.csproj -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build Windows application
        run: |
          dotnet build windows/SermonStudio/SermonStudio.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:GenerateAppxPackageOnBuild=false

      - name: Upload build output for testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sermon-Studio-Windows-x64-test
          path: windows/SermonStudio/bin/x64/Release/**
          if-no-files-found: error
          retention-days: 14
